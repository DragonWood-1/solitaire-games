<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c62a47;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="spadeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3460;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e94560;stop-opacity:0.8" />
      <stop offset="100%" style="stop-color:#533483;stop-opacity:0.8" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="4" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="shadow">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#e94560" flood-opacity="0.5"/>
    </filter>
  </defs>
  <!-- Background -->
  <rect width="512" height="512" fill="url(#bgGrad)" rx="64"/>
  <!-- Background grid pattern -->
  <g opacity="0.1">
    <line x1="0" y1="128" x2="512" y2="128" stroke="#e94560" stroke-width="1"/>
    <line x1="0" y1="256" x2="512" y2="256" stroke="#e94560" stroke-width="1"/>
    <line x1="0" y1="384" x2="512" y2="384" stroke="#e94560" stroke-width="1"/>
    <line x1="128" y1="0" x2="128" y2="512" stroke="#e94560" stroke-width="1"/>
    <line x1="256" y1="0" x2="256" y2="512" stroke="#e94560" stroke-width="1"/>
    <line x1="384" y1="0" x2="384" y2="512" stroke="#e94560" stroke-width="1"/>
  </g>
  <!-- Playing card shadow -->
  <rect x="124" y="84" width="264" height="344" fill="#000" opacity="0.4" rx="20"/>
  <!-- Playing card -->
  <rect x="116" y="76" width="264" height="344" fill="#f0f0f5" rx="20" filter="url(#shadow)"/>
  <!-- Card border gradient -->
  <rect x="116" y="76" width="264" height="344" fill="none" stroke="url(#glowGrad)" stroke-width="3" rx="20"/>
  <!-- A top-left -->
  <text x="138" y="124" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#1a1a2e">A</text>
  <!-- Spade top-left -->
  <text x="138" y="158" font-family="Arial, sans-serif" font-size="28" fill="#1a1a2e">♠</text>
  <!-- Center large spade -->
  <text x="256" y="290" font-family="Arial, sans-serif" font-size="160" fill="#1a1a2e" text-anchor="middle" dominant-baseline="middle" filter="url(#glow)">♠</text>
  <!-- A bottom-right (rotated) -->
  <text x="374" y="388" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#1a1a2e" text-anchor="middle" transform="rotate(180, 374, 388)">A</text>
  <!-- Spade bottom-right (rotated) -->
  <text x="374" y="354" font-family="Arial, sans-serif" font-size="28" fill="#1a1a2e" text-anchor="middle" transform="rotate(180, 374, 354)">♠</text>
  <!-- SR text at bottom -->
  <text x="256" y="476" font-family="'Courier New', monospace" font-size="36" font-weight="bold" fill="url(#glowGrad)" text-anchor="middle" letter-spacing="8" filter="url(#glow)">SR</text>
  <!-- Corner decorations -->
  <circle cx="80" cy="80" r="20" fill="none" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <circle cx="432" cy="80" r="20" fill="none" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <circle cx="80" cy="432" r="20" fill="none" stroke="#e94560" stroke-width="2" opacity="0.5"/>
  <circle cx="432" cy="432" r="20" fill="none" stroke="#e94560" stroke-width="2" opacity="0.5"/>
</svg>